<div>总访问量：<span id="pv">加载中...</span></div>
<div>下载按钮点击：<span id="download">加载中...</span></div>
<button id="downloadBtn">下载App</button>

<script>
// 页面加载PV自增
(async () => {
  try {
    const res = await fetch("https://xuterm-fgxtdeno8-xuyq1113-7560s-projects.vercel.app/api/stats?action=pageview");
    // 先判断接口返回是否正常
    if (!res.ok) throw new Error(`接口响应异常，状态码：${res.status}`);
    const data = await res.json();
    document.getElementById("pv").innerText = data.pageView;
  } catch(err) {
    // 控制台打印完整错误堆栈
    console.error("页面访问统计请求失败：", err);
    // 页面展示简化错误提示，附带原因
    document.getElementById("pv").innerText = "统计异常：" + err.message;
  }
})();

// 下载按钮点击计数
document.getElementById("downloadBtn").addEventListener("click", async () => {
  try {
    const res = await fetch("https://xuterm-fgxtdeno8-xuyq1113-7560s-projects.vercel.app/api/stats?action=download");
    if (!res.ok) throw new Error(`接口响应异常，状态码：${res.status}`);
    const data = await res.json();
    document.getElementById("download").innerText = data.downloadClick;
  } catch(err) {
    // 打印点击统计完整错误
    console.error("下载点击统计请求失败：", err);
    alert("点击计数失败：" + err.message);
  }
});
</script>
